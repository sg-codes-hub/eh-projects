<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-E Mock Paper Audit v7</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#faf8f2;color:#252525;padding:16px}main{max-width:1100px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#222;color:#fff}.paper{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pass{color:#176b35}.fail{color:#a12626}.warn{color:#9a5b00}pre{white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:10px;overflow:auto}.meta{color:#666}</style></head><body><main><h1>Class 10 English 15-E — Mock Papers 1–10 Audit v7</h1><p>Uses the current loader and blueprint engine. Fixed target: <b>47 questions / 100 marks / Sections I–XIII</b>.</p><button id="run">Run audit</button> <button id="download" disabled>Download JSON</button><div id="status">Starting…</div><div id="results"></div><script src="assets/js/question-bank-loader.js?v=20260908-05"></script><script src="assets/js/final-blueprint-engine.js?v=20260908-05"></script><script>
const $=id=>document.getElementById(id);const txt=q=>String(q?.question||q?.prompt||q?.text||'').trim();const ans=q=>{let v=q?.model_answer??q?.answer??q?.answer_points??'';if(Array.isArray(v))v=v.join('. ');return String(v||'').trim()};const sent=s=>String(s).replace(/\n+/g,' ').split(/[.!?]+(?:\s|$)/).map(x=>x.trim()).filter(Boolean).length;const typ=q=>String(q?.type||q?.question_type||'').toLowerCase();
function lkind(q){let s=[q?.letter_type,q?.skill,q?.topic,q?.category,txt(q)].filter(Boolean).join(' ').toLowerCase();if(/informal/.test(s)||/to your (friend|cousin|brother|sister|uncle|aunt)|inviting (him|her)|write a letter to your/.test(s))return'informal';if(/formal/.test(s)||/to the (editor|headmaster|principal|municipal|commissioner|chief engineer|authority)|complaining|requesting|application to/.test(s))return'formal';return'unknown'}
function lformat(q){let a=ans(q).toLowerCase(),k=lkind(q);return{k,address:/\[address\]|address|road|street|nagar|shahapur|kalaburagi|karnataka|india/.test(a),date:/\[date\]|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2},?\s+\d{4}\b|\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/.test(a),to:/\bto\b/.test(a),subject:/\bsubject\s*:/.test(a),sal:/\b(?:sir|madam|respected|dear|my dear|dearest)\b/.test(a),close:/\b(?:yours faithfully|yours sincerely|yours lovingly|yours affectionately|with love|love)\b/.test(a)}}
function audit(no){let p=window.buildStrictMock(no),issues=[],warnings=[];if(p.selected.length!==47)issues.push(`main questions ${p.selected.length}/47`);if(p.totalMarks!==100)issues.push(`marks ${p.totalMarks}/100`);let sec={};p.selected.forEach(x=>{sec[x.section]=(sec[x.section]||0)+1;for(const [lab,q] of [['Q'+x.number,x.q],...(x.or?[['Q'+x.number+' OR',x.or]]:[])]){if(!q)issues.push(lab+': missing');if(x.section==='VII'&&sent(ans(q))<5)issues.push(`${lab}: ${sent(ans(q))} sentences; target 5+`);if(x.section==='X'&&sent(ans(q))<7)issues.push(`${lab}: ${sent(ans(q))} sentences; target 7+`);if(x.section==='XII'){if(typ(q)==='mcq')issues.push(lab+': MCQ in essay slot');if(sent(ans(q))<16)issues.push(`${lab}: essay ${sent(ans(q))} sentences; target about 18–20`)}if(x.section==='XIII'){let f=lformat(q);if(lkind(q)!=='formal')issues.push('Q47: first choice is not formal');if(!x.or)issues.push('Q47: missing OR choice');else{let r=lformat(x.or);if(lkind(x.or)!=='informal')issues.push('Q47 OR: second choice is not informal');if(!(f.address&&f.date&&f.to&&f.subject&&f.sal&&f.close))issues.push('Q47: formal model-answer format incomplete');if(!(r.address&&r.date&&r.sal&&r.close))issues.push('Q47 OR: informal model-answer format incomplete')}}} });if(sec.XI&&p.selected.find(x=>x.section==='XI')?.q?.passage?.length<600)issues.push('Q45: passage below 600 characters');let q47=p.selected.find(x=>x.section==='XIII');return{paper:no,status:issues.length?'FAIL':'PASS',questions:p.selected.length,totalMarks:p.totalMarks,issues,warnings,shortages:p.shortages,letter:q47?{main:{id:q47.q?.id,kind:lkind(q47.q),format:lformat(q47.q)},or:q47.or?{id:q47.or.id,kind:lkind(q47.or),format:lformat(q47.or)}:null}:null,selected:p.selected.map(x=>({n:x.number,s:x.section,id:x.q?.id||null,type:x.q?.type||null,or:x.or?.id||null}))}}
async function run(){try{let all=await QuestionBankLoader.loadAll(),rows=Array.from({length:10},(_,i)=>audit(i+1));let report={version:'v7',engine:window.__EH_FINAL_BLUEPRINT_ENGINE_VERSION,bank:all.length,letterDiagnostics:window.__EH_LETTER_DIAGNOSTICS?.(),overall:rows.every(r=>r.status==='PASS')?'PASS':'FAIL',papers:rows};window.__report=report;let f=rows.filter(r=>r.status==='FAIL').length,w=rows.reduce((a,r)=>a+r.warnings.length,0);$('status').innerHTML=`<b class="${report.overall==='PASS'?'pass':'fail'}">Overall: ${report.overall}</b> <span class="meta">— ${all.length} questions • ${f} papers with defects • ${w} warnings • engine ${report.engine}</span>`;$('results').innerHTML=rows.map(r=>`<div class="paper"><b>Mock Paper ${r.paper}: <span class="${r.status==='PASS'?'pass':'fail'}">${r.status}</span></b><div>${r.questions}/47 questions • ${r.totalMarks}/100 marks • ${r.issues.length} defects</div>${r.letter?`<p><b>Q47:</b> ${r.letter.main.id} (${r.letter.main.kind})${r.letter.or?` OR ${r.letter.or.id} (${r.letter.or.kind})`:''}</p>`:''}${r.issues.length?'<ul>'+r.issues.map(x=>`<li class="fail">${x}</li>`).join('')+'</ul>':'<div class="pass">All audited checks passed.</div>'}<details><summary>Selected IDs</summary><pre>${r.selected.map(x=>`${x.n}. ${x.s} ${x.id||'NO-ID'}${x.or?' OR '+x.or:''}`).join('\n')}</pre></details></div>`).join('')}catch(e){$('status').innerHTML='<b class="fail">Audit error: '+e+'</b>'}}$('run').onclick=run;run();</script></main></body></html>
