<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-E Mock Paper Audit</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#faf8f2;color:#252525;padding:20px}main{max-width:1200px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#222;color:#fff}.paper{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pass{color:#176b35}.fail{color:#a12626}.warn{color:#9a5b00}.meta{color:#666;font-size:13px}li{margin:4px 0}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;overflow:auto}</style></head><body><main><h1>Class 10 English 15-E — Mock Papers 1–10 Deep Audit</h1><p>This audit uses the same loader, blueprint engine and content-quality selector as the live app. Fixed target: <b>47 questions / 100 marks / Sections I–XIII</b>.</p><button id="run" type="button" onclick="location.reload()">Run audit again</button> <button id="download" type="button" disabled>Download JSON</button><div id="status">Starting audit…</div><div id="results"></div><pre id="json" hidden></pre><script src="assets/js/question-bank-loader.js?v=20260908-06"></script><script src="assets/js/final-blueprint-engine.js?v=20260908-06"></script><script src="assets/js/mock-quality-selection.js?v=20260908-02"></script><script>const $=id=>document.getElementById(id),txt=q=>String(q?.question||q?.prompt||q?.text||'').trim(),ans=q=>{const v=q?.model_answer??q?.answer??q?.answer_points??'';if(Array.isArray(v))return v.join('. ');if(v&&typeof v==='object')return Object.values(v).join('. ');return String(v||'').trim()},words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length,type=q=>String(q?.type||q?.question_type||'').toLowerCase().trim(),meta=q=>String([q?.type,q?.question_type,q?.skill,q?.category,q?.module,q?.bank_group,q?.topic,q?.domain,q?.blueprint_slot].filter(Boolean).join(' ')).toLowerCase();function letterKind(q){const s=String([q?.letter_type,q?.skill,q?.topic,q?.category,q?.question].filter(Boolean).join(' ')).toLowerCase();if(/informal\s*letter|informal_letter|informal/.test(s))return'informal';if(/formal\s*letter|formal_letter|formal/.test(s))return'formal';const t=txt(q).toLowerCase();if(/to your (friend|cousin|brother|sister|uncle|aunt)|to (my|your) friend|inviting (him|her)|write a letter to your/.test(t))return'informal';if(/to the (editor|headmaster|principal|municipal|commissioner|chief engineer|authority)|complaining|requesting|expressing concern|suggesting measures|application to/.test(t))return'formal';return'unknown'}function letterScore(q){const a=ans(q).toLowerCase(),k=letterKind(q);if(k==='unknown')return 0;let s=0;if(/\[address\]|address|street|road|nagar|shahapur|kalaburagi|kalburgi|karnataka|india/.test(a))s++;if(/\[date\]|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2}|\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/.test(a))s++;if(k==='formal'){if(/\bto\s*\n|\bto\s+(?:the|a)\b/.test(a))s++;if(/\bsubject\s*:/.test(a))s++;if(/\b(?:sir|madam|respected sir|respected madam)\b/.test(a))s++;if(/\b(?:yours faithfully|yours sincerely|yours obediently)\b/.test(a))s++;}else{if(/\bdear\b/.test(a))s++;if(/\b(?:yours lovingly|yours affectionately|with love|love)\b/.test(a))s++;}return s}function isMCQ(q){return type(q)==='mcq'}function isEssay(q){return !isMCQ(q)&&Number(q?.marks)===5&&/essay/.test(meta(q)+' '+txt(q).toLowerCase())}function basic(q,label,m,issues){if(!q){issues.push(label+': missing question record');return}if(!q.id)issues.push(label+': missing ID');if(!txt(q))issues.push(label+': missing question text');if(Number(q.marks)!==m)issues.push(label+': marks '+(q.marks??'missing')+' vs '+m);if(!ans(q))issues.push(label+': missing model answer')}function sentenceCount(q){return String(ans(q)).replace(/\n+/g,' ').split(/[.!?]+(?:\s|$)/).map(v=>v.trim()).filter(Boolean).length}function inspect(no,p){const issues=[],warnings=[],seen=new Set(),sections={};const exp={I:6,II:4,III:3,IV:7,V:7,VI:3,VII:6,VIII:4,IX:1,X:3,XI:1,XII:1,XIII:1};if(p.selected.length!==47)issues.push('main questions '+p.selected.length+'/47');if(p.totalMarks!==100)issues.push('marks '+p.totalMarks+'/100');p.selected.forEach(x=>{sections[x.section]=(sections[x.section]||0)+1;for(const[label,q]of[['Q'+x.number,x.q],...(x.or?[['Q'+x.number+' OR',x.or]]:[])]){basic(q,label,x.marks,issues);if(q?.id&&seen.has(q.id))issues.push(label+': duplicate ID '+q.id);if(q?.id)seen.add(q.id);if(x.section==='I'&&!isMCQ(q))issues.push(label+': Q1-Q6 slot is not MCQ');const min={IV:1,V:2,VII:5,X:7}[x.section];if(min&&sentenceCount(q)<min)issues.push(label+': model answer unusually short for Section '+x.section+' ('+sentenceCount(q)+' sentences; target '+min+'+)');if(x.section==='XI'&&String(q?.passage||'').trim().length<600)issues.push(label+': passage below 600 characters');if(x.section==='XI'&&!Array.isArray(q?.questions||q?.subquestions||q?.items))warnings.push(label+': passage question array not detectable; manual review');if(x.section==='XII'){if(!isEssay(q))issues.push(label+': not clearly an essay');if(sentenceCount(q)<16)issues.push(label+': essay below about-18-to-20 standard ('+sentenceCount(q)+' sentences, '+words(ans(q))+' words)')}if(x.section==='XIII'){if(letterKind(q)!=='formal')issues.push(label+': first choice is not formal');if(x.or&&letterKind(x.or)!=='informal')issues.push(label+' OR: second choice is not informal');if(letterScore(q)<6)issues.push(label+': formal letter format incomplete');if(x.or&&letterScore(x.or)<4)issues.push(label+' OR: informal letter format incomplete')}});});for(const[s,n]of Object.entries(exp))if(sections[s]!==n)issues.push('Section '+s+': '+(sections[s]||0)+'/'+n);return{paper:no,status:issues.length?'FAIL':'PASS',issues,warnings,shortages:p.shortages,totalMarks:p.totalMarks,questions:p.selected.map(x=>({number:x.number,section:x.section,id:x.q?.id||null,or:x.or?.id||null}))}}async function runAudit(){document.getElementById('status').textContent='Loading complete question bank…';try{const all=await window.QuestionBankLoader.loadAll(),rows=[];for(let i=1;i<=10;i++)rows.push(inspect(i,window.buildStrictMock(i)));const fail=rows.filter(r=>r.status==='FAIL').length,warn=rows.reduce((n,r)=>n+r.warnings.length,0),report={audit:'Mock Papers 1-10 deterministic runtime deep content audit v8.1',updated:new Date().toISOString(),bank:all.length,blueprint:'47 questions / 100 marks / Sections I-XIII',papers:rows,overall:fail?'FAIL':'PASS'};window.__auditReport=report;document.getElementById('status').innerHTML='<b class="'+(report.overall==='PASS'?'pass':'fail')+'">Overall: '+report.overall+'</b> <span class="meta">— '+all.length+' merged questions loaded • '+fail+' papers with defects • '+warn+' review warnings.</span>';document.getElementById('results').innerHTML=rows.map(r=>'<div class="paper"><b>Mock Paper '+r.paper+': <span class="'+(r.status==='PASS'?'pass':'fail')+'">'+r.status+'</span></b><div>47Q target: '+r.questions.length+' • Marks: '+r.totalMarks+' • Defects: '+r.issues.length+' • Review warnings: '+r.warnings.length+'</div>'+(r.issues.length?'<ul>'+r.issues.map(i=>'<li class="fail">'+i+'</li>').join('')+'</ul>':'')+(r.warnings.length?'<ul>'+r.warnings.map(i=>'<li class="warn">'+i+'</li>').join('')+'</ul>':'')+(!r.issues.length&&!r.warnings.length?'<div class="pass">Structure and deep content checks passed.</div>':'')+'<details><summary>Show selected IDs</summary><pre>'+r.questions.map(q=>q.number+'. ['+q.section+'] '+(q.id||'NO-ID')+(q.or?' OR '+q.or:'')).join('\n')+'</pre></details></div>').join('');document.getElementById('json').hidden=false;document.getElementById('json').textContent=JSON.stringify(report,null,2);document.getElementById('download').disabled=false}catch(e){document.getElementById('status').innerHTML='<b class="fail">Audit failed to run: '+String(e.message||e)+'</b>';console.error(e)}}document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(window.__auditReport,null,2)],{type:'application/json'}));a.download='mock-papers-audit-runtime-v8-1.json';a.click()};runAudit();</script></main></body></html>
