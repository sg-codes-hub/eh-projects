<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-E Mock Paper Audit</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#faf8f2;color:#252525;padding:20px}main{max-width:1200px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin-right:6px}.paper{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pass{color:#176b35}.fail{color:#a12626}.warn{color:#9a5b00}.meta{color:#666;font-size:13px}li{margin:4px 0}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;overflow:auto}</style></head><body><main><h1>Class 10 English 15-E — Mock Paper Audit</h1><p>Fixed target: <b>47 questions / 100 marks / Sections I–XIII</b>.</p><button id="run" type="button">Run audit again</button> <button id="download" type="button" disabled>Download JSON</button><div id="status">Loading audit…</div><div id="results"></div><pre id="json" hidden></pre></main><script src="assets/js/question-bank-loader.js?v=20260908-11"></script><script src="assets/js/final-blueprint-engine.js?v=20260908-11"></script><script src="assets/js/mock-quality-selection.js?v=20260908-10"></script><script>
(function(){'use strict';var status=document.getElementById('status'),results=document.getElementById('results'),json=document.getElementById('json'),run=document.getElementById('run'),download=document.getElementById('download'),report=null;
function n(v){return String(v??'').trim()}function type(q){return n(q?.type||q?.question_type).toLowerCase()}function ans(q){const v=q?.model_answer??q?.answer??q?.answer_points??'';return Array.isArray(v)?v.join('. '):typeof v==='object'?Object.values(v).join('. '):String(v||'')}function sentences(q){return ans(q).replace(/\n+/g,' ').split(/[.!?]+(?:\s|$)/).map(x=>x.trim()).filter(Boolean).length}function isMCQ(q){return type(q)==='mcq'}function meta(q){return n([q?.type,q?.question_type,q?.skill,q?.category,q?.module,q?.bank_group,q?.topic,q?.domain,q?.blueprint_slot].filter(Boolean).join(' ')).toLowerCase()}function text(q){return n(q?.question||q?.prompt||q?.text)}function isLit(q){if(!q||isMCQ(q))return false;const m=meta(q);return ['firstflight','footprints','poetry'].includes(n(q?.bank_group).toLowerCase())||/first flight|footprints without feet|poetry/.test(m)}function isEssay(q){return !isMCQ(q)&&Number(q?.marks)===5&&/essay/.test(meta(q)+' '+text(q))}function letterKind(q){const s=n([q?.letter_type,q?.skill,q?.topic,q?.category,q?.question].filter(Boolean).join(' ')).toLowerCase();if(/informal\s*letter|informal_letter|informal/.test(s))return'informal';if(/formal\s*letter|formal_letter|formal/.test(s))return'formal';const t=text(q).toLowerCase();if(/to your (friend|cousin|brother|sister|uncle|aunt)|to (my|your) friend|inviting (him|her)|write a letter to your/.test(t))return'informal';if(/to the (editor|headmaster|principal|municipal|commissioner|chief engineer|authority)|complaining|requesting|expressing concern|suggesting measures|application to/.test(t))return'formal';return'unknown'}function letterScore(q){const a=ans(q).toLowerCase(),k=letterKind(q);if(!k||k==='unknown')return 0;let s=0;if(/\[address\]|address|street|road|nagar|shahapur|kalaburagi|kalburgi|karnataka|india/.test(a))s++;if(/\[date\]|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2}|\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/.test(a))s++;if(k==='formal'){if(/\bto\b/.test(a))s++;if(/\bsubject\s*:/.test(a))s++;if(/\b(?:sir|madam|respected sir|respected madam)\b/.test(a))s++;if(/\b(?:yours faithfully|yours sincerely|yours obediently)\b/.test(a))s++;}else{if(/\bdear\b/.test(a))s++;if(/\b(?:yours lovingly|yours affectionately|with love|love)\b/.test(a))s++;}return s}function validLetter(q,k){return letterKind(q)===k}function check(p){const errors=[],warnings=[],ids=new Set(),counts={};if(!p||!Array.isArray(p.selected)){return{errors:['Mock did not build'],warnings:[]}}if(p.selected.length!==47)errors.push('Expected 47 main questions, got '+p.selected.length);const marks=p.selected.reduce((s,x)=>s+Number(x.marks||0),0);if(marks!==100)errors.push('Expected 100 marks, got '+marks);const sec={I:6,II:4,III:3,IV:7,V:7,VI:3,VII:6,VIII:4,IX:1,X:3,XI:1,XII:1,XIII:1};const got={};p.selected.forEach(x=>{got[x.section]=(got[x.section]||0)+1;[x.q,x.or].filter(Boolean).forEach(q=>{const id=q?.id||meta(q)+'|'+text(q);ids.add(id);counts[id]=(counts[id]||0)+1;if(x.section==='I'&&!isMCQ(q))errors.push('Section I contains non-MCQ: '+id);if(x.section!=='I'&&isMCQ(q))errors.push('MCQ outside Section I: '+id);});});Object.entries(sec).forEach(([s,n])=>{if(got[s]!==n)errors.push('Section '+s+' expected '+n+' main questions, got '+(got[s]||0))});Object.entries(counts).filter(([id,n])=>n>1).forEach(([id,n])=>errors.push('Duplicate selected ID: '+id+' ×'+n));p.selected.forEach(x=>{const choices=[{q:x.q,main:true},{q:x.or,main:false}].filter(c=>c.q);choices.forEach(c=>{const q=c.q;if(x.section==='IV'&&sentences(q)<1)errors.push('Section IV answer too short: '+(q?.id||'?'));if(x.section==='V'&&sentences(q)<2)errors.push('Section V answer too short: '+(q?.id||'?'));if(x.section==='VII'&&sentences(q)<5)errors.push('Section VII answer too short: '+(q?.id||'?'));if(x.section==='X'&&sentences(q)<7)errors.push('Section X answer too short: '+(q?.id||'?'));if(x.section==='XI'&&String(q?.passage||'').trim().length<600)warnings.push('Section XI passage is under 600 characters: '+(q?.id||'?'));if(x.section==='XII'&&(!isEssay(q)||sentences(q)<16))errors.push('Section XII essay quality/length failed: '+(q?.id||'?'));if(x.section==='XIII'&&c.main&&!validLetter(q,'formal'))errors.push('Section XIII main must be formal: '+(q?.id||'?'));if(x.section==='XIII'&&!c.main&&(!x.or||!validLetter(q,'informal')))errors.push('Section XIII OR must be informal: '+(q?.id||'?'));});});const q45=p.selected.find(x=>x.section==='XI');if(q45&&q45.q&&Array.isArray(q45.q.questions)&&q45.q.questions.length<1)warnings.push('Section XI has an empty subquestion array: '+(q45.q.id||'?'));return{errors,warnings,ids:[...ids]}}
async function start(){status.textContent='Loading question bank…';try{const all=await window.QuestionBankLoader.loadAll();window.EnglishHubQuestions=all;window.qs=all;const papers=[];for(let i=1;i<=10;i++){const p=window.buildStrictMock(i),c=check(p);papers.push({paper:i,pass:c.errors.length===0,errors:c.errors,warnings:c.warnings,selected:p.selected.map(x=>({number:x.number,section:x.section,marks:x.marks,id:x.q?.id||'',orId:x.or?.id||'',question:x.q?.question||'',orQuestion:x.or?.question||''}))});}const defects=papers.filter(p=>!p.pass).length,warn=papers.reduce((s,p)=>s+p.warnings.length,0);report={audit:'15-E Mock Paper Audit v8.8',updated:new Date().toISOString(),mergedQuestions:all.length,expected:{questions:47,marks:100,sections:13},papers,defectPapers:defects,totalWarnings:warn,overall:defects===0&&warn===0?'PASS':defects===0?'PASS_WITH_WARNINGS':'FAIL'};status.innerHTML='<b class="'+(report.overall==='PASS'?'pass':report.overall==='PASS_WITH_WARNINGS'?'warn':'fail')+'">Overall: '+report.overall+'</b> — '+all.length+' merged questions loaded — '+defects+' papers with defects — '+warn+' review warnings';results.innerHTML=papers.map(p=>'<div class="paper"><b class="'+(p.pass?'pass':'fail')+'">Mock Paper '+p.paper+': '+(p.pass?'PASS':'FAIL')+'</b><div class="meta">47Q target • 100 marks • Defects: '+p.errors.length+' • Review warnings: '+p.warnings.length+'</div>'+((p.errors.length||p.warnings.length)?'<ul>'+p.errors.map(x=>'<li class="fail">'+x+'</li>').concat(p.warnings.map(x=>'<li class="warn">'+x+'</li>')).join('')+'</ul>':'')+'</div>').join('');json.textContent=JSON.stringify(report,null,2);download.disabled=false;}catch(e){status.innerHTML='<b class="fail">Audit failed:</b> '+e.message}}run.onclick=start;download.onclick=()=>{const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='15e-mock-paper-audit.json';a.click()};start();})();</script></body></html>
