<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-E Mock Paper Audit</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#faf8f2;color:#252525;padding:20px}main{max-width:1200px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#222;color:#fff}.paper{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pass{color:#176b35}.fail{color:#a12626}.warn{color:#9a5b00}.meta{color:#666;font-size:13px}li{margin:4px 0}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;overflow:auto}</style></head>
<body><main><h1>Class 10 English 15-E — Mock Papers 1–10 Deep Audit</h1><p>This audit uses the same loader and deterministic blueprint engine as the live app. It checks the fixed <b>47-question / 100-mark / Sections I–XIII</b> pattern and audits both the main and OR records selected for each mock paper.</p><button id="run">Run audit again</button> <button id="download" disabled>Download JSON</button><div id="status">Starting audit…</div><div id="results"></div><pre id="json" hidden></pre>
<script src="assets/js/question-bank-loader.js?v=20260908-audit6"></script><script src="assets/js/final-blueprint-engine.js?v=20260908-audit6"></script>
<script>
const $=id=>document.getElementById(id);const text=q=>String(q?.question||q?.prompt||q?.text||'').trim();const answerText=q=>{const v=q?.model_answer??q?.answer??q?.answer_points??'';if(Array.isArray(v))return v.join('; ');if(v&&typeof v==='object')return Object.values(v).join('; ');return String(v).trim()};const sentences=s=>String(s||'').replace(/\n+/g,' ').split(/[.!?]+(?:\s|$)/).map(x=>x.trim()).filter(Boolean).length;const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;const type=q=>String(q?.type||q?.question_type||'').toLowerCase().trim();
function letterKind(q){const lt=String(q?.letter_type||q?.skill||q?.category||'').toLowerCase();if(/informal/.test(lt))return'informal';if(/formal/.test(lt))return'formal';const s=text(q).toLowerCase();if(/to your (friend|cousin|brother|sister|uncle|aunt)|to (my|your) friend|inviting (him|her)|write a letter to your/.test(s))return'informal';if(/to the (editor|headmaster|principal|municipal|commissioner|chief engineer|authority)|complaining|requesting|expressing concern|suggesting measures|application to/.test(s))return'formal';return'unknown'}
function letterFormat(q){const a=answerText(q).toLowerCase(),kind=letterKind(q);const hasAddress=/\[address\]|address|street|road|nagar|shahapur|kalaburagi|kalburgi|karnataka|india/i.test(a),hasDate=/\[date\]|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2},?\s+\d{4}\b|\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/i.test(a),hasTo=/\n\s*to\s*\n|\bto\s+(?:the|a)\b/.test(a),hasSubject=/\bsubject\s*:/.test(a),hasFormalSalutation=/\b(?:sir|madam|respected sir|respected madam)\b/.test(a),hasInformalSalutation=/\b(?:dear|my dear|dearest)\b/.test(a),hasClosing=/\b(?:yours faithfully|yours sincerely|yours lovingly|yours affectionately|with love|love)\b/.test(a);if(kind==='formal')return{kind,ok:hasAddress&&hasDate&&hasTo&&hasSubject&&hasFormalSalutation&&hasClosing};if(kind==='informal')return{kind,ok:hasAddress&&hasDate&&hasInformalSalutation&&hasClosing};return{kind,ok:false}}
function optionsCount(q){const o=q?.options||q?.choices||q?.alternatives||q?.mcq_options;if(Array.isArray(o))return o.length;if(o&&typeof o==='object')return Object.keys(o).length;const m=text(q).match(/\([A-D]\)/g);return m?new Set(m).size:0}
function basic(q,label,marks,issues){if(!q){issues.push(label+': missing question record');return}if(!q.id)issues.push(label+': missing ID');if(!text(q))issues.push(label+': missing question text');if(Number(q.marks)!==Number(marks))issues.push(label+': marks '+(q.marks??'missing')+' vs expected '+marks);if(!answerText(q))issues.push(label+': missing model answer/answer points')}
function inspectPaper(no,p){const issues=[],warnings=[],seenIds=new Set(),seenText=new Map(),sectionCounts={},expected={I:6,II:4,III:3,IV:7,V:7,VI:3,VII:6,VIII:4,IX:1,X:3,XI:1,XII:1,XIII:1};if(p.selected.length!==47)issues.push('main questions '+p.selected.length+'/47');if(p.totalMarks!==100)issues.push('marks '+p.totalMarks+'/100');p.selected.forEach(x=>{sectionCounts[x.section]=(sectionCounts[x.section]||0)+1;const choices=[['Q'+x.number,x.q],...(x.or?[['Q'+x.number+' OR',x.or]]:[])];choices.forEach(([label,q])=>{basic(q,label,x.marks,issues);const id=q?.id||'';if(id&&seenIds.has(id))issues.push(label+': duplicate ID '+id);if(id)seenIds.add(id);const qt=text(q).replace(/\s+/g,' ').toLowerCase();if(qt){if(seenText.has(qt))issues.push(label+': duplicate question text with '+seenText.get(qt));else seenText.set(qt,label)}if(x.section==='I'){if(!/mcq/.test(type(q)))issues.push(label+': Q1-Q6 slot is not MCQ');if(optionsCount(q)<4)issues.push(label+': MCQ has fewer than 4 detectable options')}if(x.section==='II'&&!/analogy|relationship|pair/.test((type(q)+' '+text(q)).toLowerCase()))issues.push(label+': not clearly an analogy/relationship item');if(x.section==='III'&&!/rewrite|transform|change|question|voice|degree|reported|direct/.test((type(q)+' '+text(q)).toLowerCase()))warnings.push(label+': rewrite slot should be manually reviewed');if(x.section==='VI'&&!/rewrite|transform|change|question|voice|degree|reported|direct|grammar/.test((type(q)+' '+text(q)).toLowerCase()))warnings.push(label+': grammar/rewrite slot should be manually reviewed');const min={IV:1,V:2,VII:5,X:7}[x.section];if(min){const n=sentences(answerText(q));if(n<min)issues.push(label+': model answer unusually short for Section '+x.section+' ('+n+' sentences; target '+min+'+)')}if(x.section==='VIII'&&!/rtc|reference|context/.test((type(q)+' '+text(q)).toLowerCase()))issues.push(label+': Section VIII item is not clearly RTC/reference-to-context');if(x.section==='IX'&&!/quote|memory/.test((type(q)+' '+text(q)).toLowerCase()))issues.push(label+': Section IX item is not clearly quote-from-memory');if(x.section==='XI'){const passage=String(q?.passage||'').trim();if(passage.length<600)issues.push(label+': passage below 600 characters ('+passage.length+')');const sub=q?.questions||q?.subquestions||q?.items;if(!Array.isArray(sub)||sub.length<2)warnings.push(label+': passage has no clearly detectable multi-question array; manual review needed')}if(x.section==='XII'){const n=sentences(answerText(q)),w=words(answerText(q)),meta=(type(q)+' '+text(q)+' '+String(q?.skill||'')).toLowerCase();if(/mcq/.test(type(q)))issues.push(label+': essay slot contains an MCQ');if(!/essay/.test(meta))issues.push(label+': Section XII item is not clearly an essay');if(n<16)issues.push(label+': essay model answer below about-18-to-20 standard ('+n+' sentences, '+w+' words)');else if(n<18)warnings.push(label+': essay model answer slightly below stated 18–20 sentence target ('+n+')')}if(x.section==='XIII'){if(!x.or)issues.push('Q47: missing Formal OR Informal choice');else{const lf=letterFormat(q),ri=letterFormat(x.or);if(lf.kind!=='formal')issues.push(label+': first choice is not formal');if(ri.kind!=='informal')issues.push('Q'+x.number+' OR: second choice is not informal');if(!lf.ok)issues.push(label+': formal letter model-answer format incomplete');if(!ri.ok)issues.push('Q'+x.number+' OR: informal letter model-answer format incomplete')}}});});for(const[s,n]of Object.entries(expected))if(sectionCounts[s]!==n)issues.push('Section '+s+': '+(sectionCounts[s]||0)+'/'+n);return{paper:no,status:issues.length?'FAIL':'PASS',issues,warnings,shortages:p.shortages,sectionCounts,totalMarks:p.totalMarks,questions:p.selected.map(x=>({number:x.number,section:x.section,marks:x.marks,id:x.q?.id||null,type:x.q?.type||null,question:text(x.q).slice(0,220),or:x.or?{id:x.or.id||null,type:x.or.type||null,question:text(x.or).slice(0,220)}:null}))}}
async function run(){ $('status').textContent='Loading complete question bank…';try{const all=await window.QuestionBankLoader.loadAll(),rows=[];for(let i=1;i<=10;i++)rows.push(inspectPaper(i,window.buildStrictMock(i)));const report={audit:'Mock Papers 1-10 deterministic runtime deep content audit v6',updated:new Date().toISOString(),bankStatus:window.EnglishHubBankStatus||null,blueprint:'47 questions / 100 marks / Sections I-XIII',papers:rows,overall:rows.every(x=>x.status==='PASS')?'PASS':'FAIL'};window.__auditReport=report;const fail=rows.filter(x=>x.status==='FAIL').length,warn=rows.reduce((n,x)=>n+x.warnings.length,0);$('status').innerHTML=`<b class="${report.overall==='PASS'?'pass':'fail'}">Overall: ${report.overall}</b> <span class="meta">— ${all.length} merged questions loaded • ${fail} papers with defects • ${warn} review warnings.</span>`;$('results').innerHTML=rows.map(r=>`<div class="paper"><b>Mock Paper ${r.paper}: <span class="${r.status==='PASS'?'pass':'fail'}">${r.status}</span></b><div>47Q target: ${r.questions.length} • Marks: ${r.totalMarks} • Defects: ${r.issues.length} • Review warnings: ${r.warnings.length}</div>${r.issues.length?'<ul>'+r.issues.map(i=>`<li class="fail">${i}</li>`).join('')+'</ul>':''}${r.warnings.length?'<ul>'+r.warnings.map(i=>`<li class="warn">${i}</li>`).join('')+'</ul>':''}${!r.issues.length&&!r.warnings.length?'<div class="pass">Structure and deep content checks passed.</div>':''}<details><summary>Show selected question IDs and text</summary><pre>${r.questions.map(q=>`${q.number}. [${q.section}] ${q.id||'NO-ID'}${q.or?' OR '+q.or.id:''}\n   ${q.question}${q.or?'\n   OR: '+q.or.question:''}`).join('\n')}</pre></details></div>`).join('');$('json').hidden=false;$('json').textContent=JSON.stringify(report,null,2);$('download').disabled=false}catch(e){$('status').innerHTML='<b class="fail">Audit failed to run: '+String(e.message||e)+'</b>';console.error(e)}}$('run').onclick=run;$('download').onclick=()=>{const b=new Blob([JSON.stringify(window.__auditReport,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mock-papers-audit-runtime-v6.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
</script></main></body></html>
