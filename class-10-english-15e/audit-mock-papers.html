<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-E Mock Paper Audit</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#faf8f2;color:#252525;padding:20px}main{max-width:1200px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin-right:6px}.paper{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pass{color:#176b35}.fail{color:#a12626}.warn{color:#9a5b00}.meta{color:#666;font-size:13px}li{margin:4px 0}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;overflow:auto}</style></head><body><main><h1>Class 10 English 15-E — Mock Papers 1–10 Deep Audit</h1><p>This audit uses the same loader and deterministic blueprint engine as the live app. It checks the fixed <b>47-question / 100-mark / Sections I–XIII</b> pattern and audits both main and OR records.</p><button id="run">Run audit again</button><button id="download" disabled>Download JSON</button><div id="status">Starting audit…</div><div id="results"></div><pre id="json" hidden></pre><script src="assets/js/question-bank-loader.js?v=20260908-audit8"></script><script src="assets/js/final-blueprint-engine.js?v=20260908-audit8"></script><script>
const $=id=>document.getElementById(id),text=q=>String(q?.question||q?.prompt||q?.text||'').trim(),ans=q=>{const v=q?.model_answer??q?.answer??q?.answer_points??'';return Array.isArray(v)?v.join('; '):typeof v==='object'?Object.values(v).join('; '):String(v).trim()},type=q=>String(q?.type||q?.question_type||'').toLowerCase(),sent=s=>String(s||'').replace(/\n+/g,' ').split(/[.!?]+(?:\s|$)/).map(x=>x.trim()).filter(Boolean).length,words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
function letterKind(q){const m=String(q?.letter_type||q?.skill||q?.category||q?.topic||'').toLowerCase(),s=text(q).toLowerCase(),a=ans(q).toLowerCase();if(/informal/.test(m)||/to your (friend|cousin|brother|sister|uncle|aunt)|to (my|your) friend|inviting (him|her)|write a letter to your/.test(s)||/dear (friend|[a-z]+)|yours lovingly|yours affectionately|with love/.test(a))return'informal';if(/formal/.test(m)||/to the (editor|headmaster|principal|municipal|commissioner|chief engineer|authority)|complaining|requesting|expressing concern|suggesting measures|application to/.test(s)||/subject\s*:|dear sir|dear madam|yours faithfully|yours sincerely/.test(a))return'formal';return'unknown'}
function letterFormat(q){const a=ans(q).toLowerCase(),k=letterKind(q);const address=/\[address\]|address|street|road|nagar|shahapur|kalaburagi|kalburgi|karnataka|india/.test(a),date=/\[date\]|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2},?\s+\d{4}\b|\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/.test(a),to=/\n\s*to\s*\n|\bto\s+(?:the|a)\b/.test(a),subject=/\bsubject\s*:/.test(a),formalSal=/\b(?:sir|madam|respected sir|respected madam)\b/.test(a),informalSal=/\b(?:dear|my dear|dearest)\b/.test(a),closing=/\b(?:yours faithfully|yours sincerely|yours lovingly|yours affectionately|with love|love)\b/.test(a);return k==='formal'?{k,ok:address&&date&&to&&subject&&formalSal&&closing}:{k,ok:k==='informal'&&address&&date&&informalSal&&closing}}
function basic(q,label,marks,issues){if(!q){issues.push(label+': missing question record');return}if(!q.id)issues.push(label+': missing ID');if(!text(q))issues.push(label+': missing question text');if(Number(q.marks)!==Number(marks))issues.push(label+': marks mismatch');if(!ans(q))issues.push(label+': missing model answer')}
function inspect(no,p){const issues=[],warnings=[],seen=new Set(),sectionCounts={},expected={I:6,II:4,III:3,IV:7,V:7,VI:3,VII:6,VIII:4,IX:1,X:3,XI:1,XII:1,XIII:1};if(p.selected.length!==47)issues.push('main questions '+p.selected.length+'/47');if(p.totalMarks!==100)issues.push('marks '+p.totalMarks+'/100');for(const x of p.selected){sectionCounts[x.section]=(sectionCounts[x.section]||0)+1;const q=x.q;basic(q,'Q'+x.number,x.marks,issues);if(q?.id&&seen.has(q.id))issues.push('Q'+x.number+': duplicate ID '+q.id);if(q?.id)seen.add(q.id);if(x.or){basic(x.or,'Q'+x.number+' OR',x.marks,issues);if(x.or.id&&seen.has(x.or.id))issues.push('Q'+x.number+' OR: duplicate ID '+x.or.id);if(x.or.id)seen.add(x.or.id)}if(x.section==='I'&&(!/mcq/.test(type(q))||!((q.options||q.choices||q.alternatives)&&Object.keys(q.options||q.choices||q.alternatives).length>=4)))issues.push('Q'+x.number+': invalid MCQ');const min={IV:1,V:2,VII:5,X:7}[x.section];for(const z of [q,x.or].filter(Boolean)){if(min&&sent(ans(z))<min)issues.push('Q'+x.number+(z===x.or?' OR':'')+': model answer unusually short for Section '+x.section+' ('+sent(ans(z))+' sentences; target '+min+'+)');if(x.section==='XII'){const n=sent(ans(z)),meta=(type(z)+' '+text(z)+' '+String(z.skill||'')).toLowerCase();if(/mcq/.test(type(z)))issues.push('Q46: essay slot contains an MCQ');if(!/essay/.test(meta))issues.push('Q46: not clearly an essay');if(n<16)issues.push('Q46: essay below about-18-to-20 standard ('+n+' sentences, '+words(ans(z))+' words)');else if(n<18)warnings.push('Q46: essay slightly below stated 18–20 sentence target ('+n+')')}}if(x.section==='XI'&&String(q?.passage||'').trim().length<600)issues.push('Q45: passage below 600 characters');if(x.section==='XIII'){if(!x.or)issues.push('Q47: missing Formal OR Informal choice');else{const f=letterFormat(q),i=letterFormat(x.or);if(f.k!=='formal')issues.push('Q47: first choice is not formal');if(i.k!=='informal')issues.push('Q47 OR: second choice is not informal');if(!f.ok)issues.push('Q47: formal letter format incomplete');if(!i.ok)issues.push('Q47 OR: informal letter format incomplete')}}}for(const[s,n]of Object.entries(expected))if(sectionCounts[s]!==n)issues.push('Section '+s+': '+(sectionCounts[s]||0)+'/'+n);return{paper:no,status:issues.length?'FAIL':'PASS',issues,warnings,totalMarks:p.totalMarks,questions:p.selected.map(x=>({number:x.number,section:x.section,marks:x.marks,id:x.q?.id||null,type:x.q?.type||null,question:text(x.q).slice(0,220),or:x.or?{id:x.or.id||null,type:x.or.type||null,question:text(x.or).slice(0,220)}:null}))}}
async function run(){try{const all=await window.QuestionBankLoader.loadAll(),rows=[];for(let i=1;i<=10;i++)rows.push(inspect(i,window.buildStrictMock(i)));const report={audit:'Mock Papers 1-10 deterministic runtime deep content audit v8',updated:new Date().toISOString(),bankStatus:window.EnglishHubBankStatus||null,blueprint:'47 questions / 100 marks / Sections I-XIII',papers:rows,overall:rows.every(r=>r.status==='PASS')?'PASS':'FAIL'};window.__auditReport=report;const fails=rows.filter(r=>r.status==='FAIL').length,warns=rows.reduce((n,r)=>n+r.warnings.length,0);$('status').innerHTML='<b class="'+(report.overall==='PASS'?'pass':'fail')+'">Overall: '+report.overall+'</b> <span class="meta">— '+all.length+' merged questions loaded • '+fails+' papers with defects • '+warns+' review warnings.</span>';$('results').innerHTML=rows.map(r=>'<div class="paper"><b>Mock Paper '+r.paper+': <span class="'+(r.status==='PASS'?'pass':'fail')+'">'+r.status+'</span></b><div>47Q target: '+r.questions.length+' • Marks: '+r.totalMarks+' • Defects: '+r.issues.length+' • Review warnings: '+r.warnings.length+'</div>'+(r.issues.length?'<ul>'+r.issues.map(i=>'<li class="fail">'+i+'</li>').join('')+'</ul>':'')+(r.warnings.length?'<ul>'+r.warnings.map(i=>'<li class="warn">'+i+'</li>').join('')+'</ul>':'')+(!r.issues.length&&!r.warnings.length?'<div class="pass">Structure and deep content checks passed.</div>':'')+'<details><summary>Show selected question IDs and text</summary><pre>'+r.questions.map(q=>q.number+'. ['+q.section+'] '+q.id+(q.or?' OR '+q.or.id:'')+'\n   '+q.question+(q.or?'\n   OR: '+q.or.question:'')).join('\n')+'</pre></details></div>').join('');$('json').hidden=false;$('json').textContent=JSON.stringify(report,null,2);$('download').disabled=false}catch(e){$('status').innerHTML='<b class="fail">Audit failed to run: '+String(e.message||e)+'</b>';console.error(e)}}$('run').onclick=run;$('download').onclick=()=>{const b=new Blob([JSON.stringify(window.__auditReport,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mock-papers-audit-runtime-v8.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};run();</script></main></body></html>
