<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Results | English Hub 15-E</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div><p class="eyebrow">ENGLISH HUB</p><h1>My Results</h1><p>Class 10 First Language English (NCERT) • 15-E</p></div></header><main class="container"><section class="hero"><h2 id="summary">No practice results yet</h2><div id="latest"></div></section><section class="hero"><h2>Weak Areas</h2><div id="weak">Complete some objective practice to see priority areas.</div></section><section class="hero"><h2>Privacy</h2><p>Results are stored only in this browser. No student account is required.</p><button id="clear" type="button">Clear My Results</button></section></main><script src="results-v1.js"></script><script>const r=ResultsV1.loadResults();if(r.length){const last=r[r.length-1];document.getElementById('summary').textContent=`Latest: ${last.score}/${last.total} (${last.accuracy}% accuracy)`;document.getElementById('latest').textContent=`${last.mode||'Practice'} • ${last.attempted} attempted`;const areas=last.weakAreas||[];if(areas.length)document.getElementById('weak').innerHTML=areas.slice(0,5).map(x=>`<p><strong>${x.area}</strong>: ${x.accuracy}% (${x.correct}/${x.attempted})</p>`).join('')}document.getElementById('clear').onclick=()=>{if(confirm('Clear locally stored results?')){localStorage.removeItem('eh15e.results.v1');location.reload()}};</script></body></html>
