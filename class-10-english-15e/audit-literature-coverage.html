<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15-E Literature Coverage Audit</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#faf8f2;color:#252525;padding:20px}main{max-width:1250px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#222;color:#fff;margin-right:6px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.pass{color:#176b35}.warn{color:#9a5b00}.fail{color:#a12626}.meta{color:#666;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f2f0ea}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;overflow:auto}.pill{display:inline-block;margin:2px 4px 2px 0;padding:3px 7px;border-radius:999px;background:#eee}</style></head><body><main><h1>Class 10 English 15-E — Literature Coverage &amp; Diversity Audit</h1><p>Checks the deterministic Mock Papers 1–10 against the fixed blueprint without changing the 47-question / 100-mark structure.</p><button id="run">Run audit</button><button id="download" disabled>Download JSON</button><div id="status">Loading…</div><div id="out"></div></main><script src="assets/js/question-bank-loader.js?v=20260908-11"></script><script src="assets/js/final-blueprint-engine.js?v=20260908-11"></script><script src="assets/js/mock-quality-selection.js?v=20260908-09"></script><script>
(function(){'use strict';
const EXPECTED=['A Letter to God','Nelson Mandela: Long Walk to Freedom','His First Flight','The Black Aeroplane','From the Diary of Anne Frank','A Baker from Goa','Coorg','Tea from Assam','Mijbil the Otter','Madam Rides the Bus','The Sermon at Benares','The Proposal','Dust of Snow','Fire and Ice','A Tiger in the Zoo','How to Tell Wild Animals','The Ball Poem','Amanda!','The Trees','Fog','The Tale of Custard the Dragon','For Anne Gregory','A Triumph of Surgery',"The Thief's Story",'The Midnight Visitor','A Question of Trust','Footprints Without Feet','The Making of a Scientist','The Necklace','Bholi','The Book That Saved the Earth'];
const LIT_SECTIONS=new Set(['IV','V','VII','VIII','IX','X']);
const $=id=>document.getElementById(id);
const norm=v=>String(v??'').trim();
function chapter(q){return norm(q&&q.chapter)||norm(q&&q.topic)||'Unknown';}
function book(q){const m=norm([q&&q.module,q&&q.book,q&&q.bank_group].filter(Boolean).join(' ')).toLowerCase();if(/footprints|supplementary/.test(m))return'Supplementary';if(/poetry|poem/.test(m)||['Dust of Snow','Fire and Ice','A Tiger in the Zoo','How to Tell Wild Animals','The Ball Poem','Amanda!','The Trees','Fog','The Tale of Custard the Dragon','For Anne Gregory'].includes(chapter(q)))return'Poetry';return'First Flight prose';}
function id(q){return norm(q&&q.id)||'NO-ID';}
function label(x){return 'Q'+x.number+(x.or?' OR':'');}
function analysePaper(no,p){const rows=[],chapterCounts={},bookCounts={};let duplicateIds=[],orSame=[];if(!p||!Array.isArray(p.selected))return{paper:no,status:'FAIL',error:'Mock did not build'};
p.selected.forEach(x=>{if(!LIT_SECTIONS.has(x.section))return;const choices=[{q:x.q,main:true},{q:x.or,main:false}].filter(c=>c.q);choices.forEach(c=>{const ch=chapter(c.q),bk=book(c.q),qid=id(c.q);chapterCounts[ch]=(chapterCounts[ch]||0)+1;bookCounts[bk]=(bookCounts[bk]||0)+1;rows.push({number:x.number,section:x.section,main:c.main,id:qid,chapter:ch,book:bk});});if(x.or&&LIT_SECTIONS.has(x.section)&&chapter(x.q)===chapter(x.or))orSame.push('Q'+x.number+' '+chapter(x.q));});
const repeated=Object.entries(chapterCounts).filter(([k,v])=>v>1).sort((a,b)=>b[1]-a[1]);const heavy=repeated.filter(([k,v])=>v>=3);const uniqueIds=new Set(rows.map(r=>r.id));return{paper:no,status:'PASS',rows,chapterCounts,bookCounts,repeated,heavy,orSame,uniqueIds:uniqueIds.size};}
function audit(all){const papers=[];for(let i=1;i<=10;i++)papers.push(analysePaper(i,window.buildStrictMock(i)));const allRows=papers.flatMap(p=>p.rows||[]),idCounts={};allRows.forEach(r=>idCounts[r.id]=(idCounts[r.id]||0)+1);const chapterCounts={};allRows.forEach(r=>chapterCounts[r.chapter]=(chapterCounts[r.chapter]||0)+1);const missing=EXPECTED.filter(x=>!chapterCounts[x]);const overusedIds=Object.entries(idCounts).filter(([id,n])=>n>=4).sort((a,b)=>b[1]-a[1]);const sameOR=papers.flatMap(p=>p.orSame.map(x=>'Paper '+p.paper+': '+x));const heavy=papers.flatMap(p=>p.heavy.map(([c,n])=>'Paper '+p.paper+': '+c+' ('+n+')'));const total=allRows.length;return{audit:'Literature Coverage & Diversity v1',updated:new Date().toISOString(),mergedQuestions:all.length,sections:Array.from(LIT_SECTIONS),totalLiteratureSelections:total,papers,chapterCounts,idCounts,missingChapters:missing,overusedIds,sameORChapterPairs:sameOR,heavyWithinPaper:heavy,overall:(missing.length||sameOR.length||heavy.length)?'REVIEW':'PASS'};}
function render(r){const total=r.totalLiteratureSelections;const bookTotals={};r.papers.forEach(p=>Object.entries(p.bookCounts||{}).forEach(([k,v])=>bookTotals[k]=(bookTotals[k]||0)+v));$('status').innerHTML='<b class="'+(r.overall==='PASS'?'pass':'warn')+'">Overall: '+r.overall+'</b> <span class="meta">— '+r.mergedQuestions+' merged questions • '+total+' literature selections across Sections IV/V/VII/VIII/IX/X.</span>';
let h='<div class="card"><b>Global coverage</b><table><tr><th>Metric</th><th>Result</th></tr><tr><td>Literature selections</td><td>'+total+'</td></tr><tr><td>Unique selected IDs</td><td>'+Object.keys(r.idCounts).length+'</td></tr><tr><td>First Flight prose / Poetry / Supplementary</td><td>'+Object.entries(bookTotals).map(([k,v])=>k+': '+v).join(' • ')+'</td></tr><tr><td>Chapters never selected</td><td>'+ (r.missingChapters.length?r.missingChapters.join(', '):'None')+'</td></tr><tr><td>Same-chapter OR pairs</td><td>'+ (r.sameORChapterPairs.length?r.sameORChapterPairs.join('; '):'None')+'</td></tr><tr><td>Heavy same-paper repetition (3+)</td><td>'+ (r.heavyWithinPaper.length?r.heavyWithinPaper.join('; '):'None')+'</td></tr><tr><td>ID reused 4+ times</td><td>'+ (r.overusedIds.length?r.overusedIds.map(x=>x[0]+' ×'+x[1]).join(', '):'None')+'</td></tr></table></div>';
h+='<div class="card"><b>Paper-by-paper diversity</b><table><tr><th>Paper</th><th>Selections</th><th>Unique IDs</th><th>Repeated chapters</th><th>Same-chapter OR</th><th>Book mix</th></tr>'+r.papers.map(p=>'<tr><td>'+p.paper+'</td><td>'+p.rows.length+'</td><td>'+p.uniqueIds+'</td><td>'+ (p.repeated.length?p.repeated.map(x=>x[0]+' ×'+x[1]).join(', '):'None')+'</td><td>'+ (p.orSame.length?p.orSame.join(', '):'None')+'</td><td>'+Object.entries(p.bookCounts).map(x=>x[0]+': '+x[1]).join(' • ')+'</td></tr>').join('')+'</table></div>';
h+='<div class="card"><b>Chapter frequency across all audited literature selections</b><pre>'+Object.entries(r.chapterCounts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+': '+x[1]).join('\n')+'</pre></div>';
$('out').innerHTML=h;window.__report=r;$('download').disabled=false;}
async function start(){try{const all=await window.QuestionBankLoader.loadAll();window.EnglishHubQuestions=all;window.qs=all;const r=audit(all);render(r);window.__EH_LITERATURE_AUDIT=r;}catch(e){$('status').innerHTML='<b class="fail">Audit failed</b> '+e.message;}}
$('run').onclick=start;start();$('download').onclick=()=>{const blob=new Blob([JSON.stringify(window.__report,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='15e-literature-coverage-audit.json';a.click();};
})();</script></body></html>
